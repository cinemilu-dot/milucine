name: Compilar APK Android

on:
  push:
    branches: [ main, principal ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Compilar APK com Buildozer
        run: |
          buildozer -v android debug

      - name: Salvar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: pacote-apk
          path: bin/*.apk
